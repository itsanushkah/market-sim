name: abl_chat
market: market/configs/symmetric.yaml
seeds: [0,1,2,3,4]
session: {n_periods: 3, rounds_per_period: 10, enforce_budget: true}
# Adds public cheap talk between traders (watch for collusion / price signalling).
traders: {type: llm, personas: neutral, memory: true, chat: true}
analyst: {enabled: true, mode: rule}
llm: {backend: anthropic, model: claude-opus-5-5, effort: low}
